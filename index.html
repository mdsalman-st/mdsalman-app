<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaRomath Translator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Background Effects -->
<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="container">
  <div class="card">

    <!-- Header -->
    <div class="header">
      <div class="brand">
        <div class="logo">🔐</div>
        <div class="brand-text">
          <h1>AlphaRomath</h1>
          <p>Private Translator</p>
        </div>
      </div>
      <div class="status">
        <span class="status-dot"></span>
        <span>SECURE</span>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-mode="encode">
        <span>📝</span> ENCODE
      </button>
      <button class="tab" data-mode="decode">
        <span>🔓</span> DECODE
      </button>
    </div>

    <!-- Body -->
    <div class="body">

      <div class="section">
        <div class="label">
          <span>INPUT</span>
          <span class="label-badge" id="inputBadge">0 CHARS</span>
        </div>
        <div class="field">
          <textarea id="input" placeholder="Type normal English here..."></textarea>
        </div>
      </div>

      <button class="convert-btn" id="convertBtn">
        ⚡ CONVERT ⚡
      </button>

      <div class="section">
        <div class="label">
          <span>OUTPUT</span>
          <span class="label-badge">ENCRYPTED</span>
        </div>
        <div class="output empty" id="output">
          <span>Awaiting input</span>
          <span class="cursor"></span>
        </div>
      </div>

      <div class="actions">
        <button class="action-btn" id="copyBtn">📋 COPY</button>
        <button class="action-btn" id="clearBtn">🗑️ CLEAR</button>
      </div>

    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="footer-left">
        <span class="dot"></span>
        <span>CONNECTED</span>
      </div>
      <div class="footer-right" id="outputBadge">0 CHARS</div>
    </div>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">COPIED!</div>

<script src="script.js"></script>
</body>
</html>
